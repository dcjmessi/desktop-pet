name: Smoke tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run application smoke test
        run: python scripts/smoke_test.py

      - name: Run encrypted peer smoke test
        run: python scripts/peer_smoke_test.py

      - name: Run online UI smoke test
        run: python scripts/online_ui_smoke_test.py
